      - TiKV store abstraction (`TikvStore`) and format version enforcement
      - transaction primitives and keyspace isolation invariants
      - keyspace routing (pool/client selection) and database prefix invariants
    non_goals:
      - 'SQL query semantics and planner/executor behavior (authoritative: `sql-engine`)'
      - 'pgwire protocol and startup messaging (authoritative: `protocol-pgwire`)'
      - 'auth/RBAC semantics (authoritative: `auth-rbac`)'
    code_entrypoints:
      - path: src/storage/encoding/mod.rs
      - path: src/storage/tikv_store/mod.rs
        symbols: [TikvStore]
      - path: src/pool.rs
        symbols: [TikvClientPool]
      - path: src/txn/mod.rs
      - path: src/main.rs
    gate_tests:
      - ci:.github/workflows/regression-gate.yml/regression-gate
      - ci:.github/workflows/orm-tests.yml/test
      - cmd:cargo test
    owners: [TBD]
    status: PARTIAL
    coverage_gaps:
      - No CODEOWNERS/maintainer ownership signal on baseline commit.
      - Existing non-SoT docs contain verified drift for key layout (see evidence snapshot).
    next_step:
      - Confirm owners and add CODEOWNERS for `src/storage/**`, `src/txn/**`, `src/pool.rs`.
      - Keep `docs/sot/storage-format.md` aligned; consider cross-linking non-SoT docs to reduce drift.
    xref:
      - module_id: protocol-pgwire
        reason: Tenant username parsing feeds keyspace routing inputs
      - module_id: ops-config
        reason: '`PD_ENDPOINTS`/`PG_KEYSPACE` and other storage-related config knobs'

  - module_id: catalog-introspection
    doc_path: docs/sot/catalog-introspection.md
    scope:
      - '`information_schema` and `pg_catalog` coverage (what exists vs stubs)'
      - OID/type catalog behavior and server introspection contract
    non_goals:
      - 'SQL planner/executor semantics outside of introspection queries (authoritative: `sql-engine`)'
      - 'storage encoding details (authoritative: `storage-format`)'
      - 'pgwire protocol framing (authoritative: `protocol-pgwire`)'
    code_entrypoints:
