      - ci:.github/workflows/orm-tests.yml/test
      - cmd:python3 scripts/integration_test.py --dsn "$PG_DSN" tests/
    owners: [TBD]
    status: PARTIAL
    coverage_gaps:
      - No CODEOWNERS/maintainer ownership signal on baseline commit.
      - Observability sys tables lack an explicit assertion-level gate (see gate inventory).
    next_step:
      - Confirm owners and add CODEOWNERS for `src/sql/**`.
      - Keep `docs/sot/sql-engine.md` aligned with code/tests and cross-links as semantics evolve.
      - Add dedicated tests for observability sys tables and make them part of regression gate.
    xref:
      - module_id: catalog-introspection
        reason: Catalog/information_schema surfaces are specified there
      - module_id: storage-format
        reason: Storage format + transaction boundaries underpin engine semantics
      - module_id: auth-rbac
        reason: Privilege checks and RBAC interactions
      - module_id: extensions-gin
        reason: Extension-provided SQL semantics and indexes
      - module_id: ops-config
        reason: Config keys that affect planner/executor/triggers/observability

