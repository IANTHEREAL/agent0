      - path: crates/pgwire/src/tokio/server.rs
    gate_tests:
      - ci:.github/workflows/ci.yml/regression-gate
      - ci:.github/workflows/ci.yml/integration-tests
      - cmd:./scripts/regression_gate.sh
    owners: [TBD]
    status: PARTIAL
    coverage_gaps:
      - No CODEOWNERS/maintainer ownership signal on baseline commit.
      - COPY syntax coverage remains narrower than PostgreSQL's full grammar.
    next_step:
      - Confirm owners and add CODEOWNERS for `src/protocol/**` and `crates/pgwire/**`.
      - Keep protocol contracts aligned with Parse fallback, portal buffering, and COPY coverage as tests evolve.
    xref:
