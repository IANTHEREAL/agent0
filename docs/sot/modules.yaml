      - Owners are still `TBD` (needs maintainer confirmation).
      - Catalog coverage is still partial; many fields are placeholders and the matrix needs expansion beyond the minimum set.
    next_step:
      - Confirm owners and add CODEOWNERS for `src/sql/catalog/**` and `src/sql/information_schema.rs`.
      - Expand the “implemented vs stubbed” matrix and add explicit gaps/next steps for ORM-facing coverage.
    xref:
      - module_id: sql-engine
        reason: Planner/executor behavior for introspection queries
      - module_id: ops-config
        reason: Introspection-related config (if any) must be uniquely defined there

  - module_id: auth-rbac
    doc_path: docs/sot/auth-rbac.md
    scope:
      - authentication primitives (users/passwords) and password hashing/verification
      - role/privilege model (GRANT/REVOKE, role membership, enforcement points)
      - security defaults and permission boundaries for built-in features
    non_goals:
      - 'pgwire auth message framing (authoritative: `protocol-pgwire`)'
      - 'SQL engine semantics not related to privileges (authoritative: `sql-engine`)'
      - 'extension-specific policy (authoritative: `extensions-gin` for extension surfaces)'
    code_entrypoints:
