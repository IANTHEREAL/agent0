      - COPY protocol handling at the pgwire boundary
    non_goals:
      - 'RBAC policy semantics (authoritative: `auth-rbac`)'
      - 'SQL planning/execution semantics after protocol dispatch (authoritative: `sql-engine`)'
      - 'storage/keyspace isolation invariants (authoritative: `storage-format`, `multi-tenancy`)'
