modules:
  - module_id: protocol-pgwire
    doc_path: docs/sot/protocol-pgwire.md
    scope:
      - pgwire startup + auth handshake (wire-level messages)
      - simple/extended query protocol framing and message handling
      - tenant username parsing (`tenant.user` / `tenant:user`) and startup parameters
      - COPY protocol surface (client-facing framing)
    non_goals:
      - 'RBAC policy semantics and privilege model (authoritative: `auth-rbac`)'
      - 'SQL parsing/planning/execution semantics (authoritative: `sql-engine`)'
      - 'storage/keyspace isolation invariants (authoritative: `storage-format`)'
    code_entrypoints:
      - path: src/main.rs
        symbols: [main]
      - path: src/protocol/handler/dynamic/mod.rs
        symbols:
          - DynamicPgHandler
      - path: src/protocol/handler/dynamic/startup.rs
        symbols:
          - authenticate_user
      - path: src/protocol/handler/tenant.rs
        symbols: [parse_tenant_username]
      - path: src/protocol/handler/portal.rs
      - path: src/protocol/copy_format.rs
      - path: crates/pgwire/src/api/auth/mod.rs
        symbols: [StartupHandler]
      - path: crates/pgwire/src/api/auth/cleartext.rs
      - path: crates/pgwire/src/tokio/server.rs
      - path: crates/pgwire/src/messages/codec.rs
    gate_tests:
      - ci:.github/workflows/regression-gate.yml/regression-gate
      - ci:.github/workflows/orm-tests.yml/test
      - cmd:./scripts/regression_gate.sh
    owners: [TBD]
    status: PARTIAL
    coverage_gaps:
      - No CODEOWNERS/maintainer ownership signal on baseline commit.
      - Owners are still `TBD` (needs maintainer confirmation).
    next_step:
      - Confirm owners and add CODEOWNERS for `src/protocol/**` and `crates/pgwire/**`.
      - Keep protocol contracts aligned with gate coverage (pg-client/extended protocol/COPY) as tests evolve.
    xref:
      - module_id: auth-rbac
        reason: Authentication/authorization semantics (policy + privilege model)
      - module_id: storage-format
        reason: Tenant isolation invariants and keyspace routing behavior
      - module_id: ops-config
        reason: TLS + protocol-related config knobs/limits

  - module_id: sql-engine
    doc_path: docs/sot/sql-engine.md
    scope:
      - SQL parsing/planning/execution semantics (DDL/DML/queries)
      - expression evaluation and type/coercion behavior
      - trigger execution model (BEFORE + async AFTER queue/worker)
      - SQL-visible internal surfaces owned by the engine (e.g. observability sys tables)
    non_goals:
      - 'persistent storage encoding and key layout (authoritative: `storage-format`)'
      - 'pgwire message framing and protocol-level behavior (authoritative: `protocol-pgwire`)'
      - 'RBAC policy definitions (authoritative: `auth-rbac`)'
    code_entrypoints:
      - path: src/sql/parser/mod.rs
        symbols: [parse_sql]
      - path: src/sql/planner/mod.rs
        symbols: [choose_join_algorithm]
      - path: src/sql/executor/core/mod.rs
        symbols: [Executor]
      - path: src/sql/expr/typed_eval/mod.rs
        symbols: [eval_typed_expr]
      - path: src/sql/triggers/mod.rs
      - path: src/sql/triggers/cache.rs
      - path: src/sql/triggers/before.rs
      - path: src/sql/triggers/rewrite.rs
      - path: src/sql/triggers/queue.rs
      - path: src/sql/triggers/worker.rs
      - path: src/sql/triggers/enqueue.rs
      - path: src/sql/triggers/execute.rs
      - path: src/worker/engine.rs
      - path: src/worker/gc.rs
      - path: src/sql/executor/triggers.rs
      - path: src/observability.rs
    gate_tests:
