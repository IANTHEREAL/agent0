[package]
name = "jsongrep"
version = "0.7.0"
edition = "2024"
description = "Vendored lib-only subset of jsongrep — query parser + DFA engine, no CLI deps"

[dependencies]
anyhow = "1.0"
pest = "2.8"
pest_derive = "2.8"
regex = "1.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_json_borrow = "0.9"
