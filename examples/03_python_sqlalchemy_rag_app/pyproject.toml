[project]
name = "db9-rag-sqlalchemy"
version = "0.1.0"
description = "RAG app for db9/staging.db9.ai using SQLAlchemy ORM + pgvector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_sqlalchemy"]
