[project]
name = "pg-todo"
version = "0.1.0"
description = "PostgreSQL TODO app demonstrating advanced features with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.12.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipython>=8.12.0",
    "pytest>=7.4.0",
]
