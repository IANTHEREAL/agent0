name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PG_PORT: 5433
  PG_USER: admin
  PG_PASSWORD: admin

jobs:
  # -- Build (single release build, shared via artifact) --------------------
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/db9-server
          retention-days: 1

  # -- Lint (independent, debug build, no release artifact) -----------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # -- Unit Tests (independent, debug build, no release artifact) -----------
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  # -- Regression Gate (download binary, no Rust needed) --------------------
  regression-gate:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orm-tests/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cache TiUP
        uses: actions/cache@v4
        with:
          path: ~/.tiup
          key: ${{ runner.os }}-tiup-v1
          restore-keys: |
            ${{ runner.os }}-tiup-

      - name: Install tiup + playground
        shell: bash
        run: |
          set -euo pipefail

          export TIUP_HOME="$HOME/.tiup"
          echo "TIUP_HOME=$TIUP_HOME" >> "$GITHUB_ENV"

          export PATH="$TIUP_HOME/bin:$PATH"
          echo "$TIUP_HOME/bin" >> "$GITHUB_PATH"

          if command -v tiup >/dev/null 2>&1; then
            if ! tiup list >/dev/null 2>&1; then
              echo "TiUP appears unhealthy; resetting TIUP_HOME..."
              rm -rf "$TIUP_HOME"
            fi
          fi

          if ! command -v tiup >/dev/null 2>&1; then
            arch="$(uname -m)"
            case "$arch" in
              x86_64|amd64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
            esac

            tiup_version="${TIUP_VERSION:-v1.16.4}"
            url="https://github.com/pingcap/tiup/releases/download/${tiup_version}/tiup-${tiup_version}-linux-${arch}.tar.gz"

            mkdir -p "$TIUP_HOME"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 -o /tmp/tiup.tar.gz "$url" \
              && tar -zxf /tmp/tiup.tar.gz -C "$TIUP_HOME"; then
              rm -f /tmp/tiup.tar.gz
            else
              rm -f /tmp/tiup.tar.gz
              rm -rf "$TIUP_HOME"
              mkdir -p "$TIUP_HOME"
              curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 \
                https://tiup-mirrors.pingcap.com/install.sh | sh
            fi
          fi

          for attempt in 1 2 3; do
            if tiup install playground; then
              break
            fi
            echo "tiup install playground failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done

          tiup --version
          tiup list >/dev/null

      - name: Run regression gate
        shell: bash
        run: ./scripts/regression_gate.sh --skip-unit --skip-build

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-reports
          path: |
            test-reports/regression-gate-*/
            orm-tests/test-results.json
            /tmp/db9-regression.log

  # -- Integration + ORM Tests (download binary) ---------------------------
  integration-tests:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orm-tests/package-lock.json

      - name: Install tiup
        shell: bash
        run: |
          set -euo pipefail

          export TIUP_HOME="$RUNNER_TEMP/tiup"
          echo "TIUP_HOME=$TIUP_HOME" >> "$GITHUB_ENV"

          export PATH="$TIUP_HOME/bin:$PATH"
          echo "$TIUP_HOME/bin" >> "$GITHUB_PATH"

          install_and_verify() {
            rm -rf "$TIUP_HOME"
            mkdir -p "$TIUP_HOME"

            local arch
            arch="$(uname -m)"
            case "$arch" in
              x86_64|amd64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported architecture: $arch" >&2; return 1 ;;
            esac

            local tiup_version url
            tiup_version="${TIUP_VERSION:-v1.16.4}"
            url="https://github.com/pingcap/tiup/releases/download/${tiup_version}/tiup-${tiup_version}-linux-${arch}.tar.gz"

            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 -o /tmp/tiup.tar.gz "$url" \
              && tar -zxf /tmp/tiup.tar.gz -C "$TIUP_HOME"; then
              rm -f /tmp/tiup.tar.gz
            else
              rm -f /tmp/tiup.tar.gz
              rm -rf "$TIUP_HOME"
              mkdir -p "$TIUP_HOME"
              curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 \
                https://tiup-mirrors.pingcap.com/install.sh | sh
            fi

            tiup --version
            tiup mirror show
            tiup list >/dev/null
            tiup install playground
          }

          for attempt in 1 2 3; do
            echo "Setting up TiUP (attempt $attempt)..."
            if install_and_verify; then
              break
            fi
            echo "TiUP setup failed; retrying..."
            sleep $((attempt * 5))
          done

          tiup list >/dev/null

      - name: Start TiKV cluster
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/tikv.toml <<'EOF'
          [storage]
          api-version = 2
          enable-ttl = true
          EOF

          PLAYGROUND_LOG=/tmp/tiup-playground.log
          rm -f "$PLAYGROUND_LOG"

          tiup playground \
            --mode tikv-slim \
            --without-monitor \
            --pd.host 127.0.0.1 \
            --pd.port 2379 \
            --kv.host 127.0.0.1 \
            --kv.config /tmp/tikv.toml \
            --kv 1 >"$PLAYGROUND_LOG" 2>&1 &
          PLAYGROUND_PID=$!

          for i in $(seq 1 120); do
            if ! kill -0 "$PLAYGROUND_PID" 2>/dev/null; then
              echo "tiup playground exited early:"
              cat "$PLAYGROUND_LOG" || true
              exit 1
            fi

            if curl -sf http://127.0.0.1:2379/pd/api/v1/health > /dev/null 2>&1; then
              if curl -sf http://127.0.0.1:2379/pd/api/v1/stores | grep -Eq '"count"[[:space:]]*:[[:space:]]*[1-9]'; then
                echo "TiKV ready after $i seconds"
                break
              fi
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:2379/pd/api/v1/health || (cat "$PLAYGROUND_LOG" && exit 1)
          curl -sf http://127.0.0.1:2379/pd/api/v1/stores | grep -Eq '"count"[[:space:]]*:[[:space:]]*[1-9]' || (cat "$PLAYGROUND_LOG" && exit 1)

      - name: Start db9-server
        run: |
          PD_ENDPOINTS=127.0.0.1:2379 \
            PG_PORT=$PG_PORT \
            DB9_BOOTSTRAP_ADMIN_USER=$PG_USER \
            DB9_BOOTSTRAP_ADMIN_PASSWORD=$PG_PASSWORD \
            ./target/release/db9-server > /tmp/db9.log 2>&1 &
          echo "DB9_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p $PG_PORT -U $PG_USER -q 2>/dev/null; then
              echo "db9-server ready after $i seconds"
              break
            fi
            sleep 1
          done
          PGPASSWORD=$PG_PASSWORD psql -h 127.0.0.1 -p $PG_PORT -U $PG_USER -d postgres -c "SELECT 1" || (cat /tmp/db9.log && exit 1)

      - name: Run integration tests
        run: |
          pip install psycopg2-binary
          python3 scripts/integration_test.py --dsn "postgres://$PG_USER:$PG_PASSWORD@127.0.0.1:$PG_PORT/postgres"

      - name: Install ORM test dependencies
        working-directory: orm-tests
        run: npm ci

      - name: Generate Prisma client
        working-directory: orm-tests
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run ORM tests
        working-directory: orm-tests
        run: npm test
        env:
          PG_DSN: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            orm-tests/test-results.json
            /tmp/db9.log

      - name: Generate test summary
        if: always()
        working-directory: orm-tests
        run: |
          if [ -f test-results.json ]; then
            node -e "
            const results = require('./test-results.json');
            const passed = results.numPassedTests || 0;
            const failed = results.numFailedTests || 0;
            const skipped = results.numPendingTests || 0;
            const total = passed + failed + skipped;

            console.log('## db9-server Test Results');
            console.log('');
            console.log('### ORM Compatibility Tests');
            console.log('');
            console.log('| Metric | Count |');
            console.log('|--------|-------|');
            console.log('| Passed | ' + passed + ' |');
            console.log('| Failed | ' + failed + ' |');
            console.log('| Skipped | ' + skipped + ' |');
            console.log('| Total | ' + total + ' |');
            console.log('');
            console.log('**Pass Rate:** ' + (total > 0 ? ((passed / total) * 100).toFixed(1) : 0) + '%');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "## db9-server Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

  # -- GORM Smoke (download binary) ----------------------------------------
  gorm-smoke:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: e2e/gorm_smoke/go.sum

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install tiup
        shell: bash
        run: |
          set -euo pipefail

          export TIUP_HOME="$RUNNER_TEMP/tiup"
          echo "TIUP_HOME=$TIUP_HOME" >> "$GITHUB_ENV"

          export PATH="$TIUP_HOME/bin:$PATH"
          echo "$TIUP_HOME/bin" >> "$GITHUB_PATH"

          install_and_verify() {
            rm -rf "$TIUP_HOME"
            mkdir -p "$TIUP_HOME"

            local arch
            arch="$(uname -m)"
            case "$arch" in
              x86_64|amd64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported architecture: $arch" >&2; return 1 ;;
            esac

            local tiup_version url
            tiup_version="${TIUP_VERSION:-v1.16.4}"
            url="https://github.com/pingcap/tiup/releases/download/${tiup_version}/tiup-${tiup_version}-linux-${arch}.tar.gz"

            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 -o /tmp/tiup.tar.gz "$url" \
              && tar -zxf /tmp/tiup.tar.gz -C "$TIUP_HOME"; then
              rm -f /tmp/tiup.tar.gz
            else
              rm -f /tmp/tiup.tar.gz
              rm -rf "$TIUP_HOME"
              mkdir -p "$TIUP_HOME"
              curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 300 \
                https://tiup-mirrors.pingcap.com/install.sh | sh
            fi

            tiup --version
            tiup mirror show
            tiup list >/dev/null
            tiup install playground
          }

          for attempt in 1 2 3; do
            echo "Setting up TiUP (attempt $attempt)..."
            if install_and_verify; then
              break
            fi
            echo "TiUP setup failed; retrying..."
            sleep $((attempt * 5))
          done

          tiup list >/dev/null

      - name: Start TiKV cluster
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/tikv.toml <<'EOF'
          [storage]
          api-version = 2
          enable-ttl = true
          EOF

          PLAYGROUND_LOG=/tmp/tiup-playground.log
          rm -f "$PLAYGROUND_LOG"

          tiup playground \
            --mode tikv-slim \
            --without-monitor \
            --pd.host 127.0.0.1 \
            --pd.port 2379 \
            --kv.host 127.0.0.1 \
            --kv.config /tmp/tikv.toml \
            --kv 1 >"$PLAYGROUND_LOG" 2>&1 &
          PLAYGROUND_PID=$!

          for i in $(seq 1 120); do
            if ! kill -0 "$PLAYGROUND_PID" 2>/dev/null; then
              echo "tiup playground exited early:"
              cat "$PLAYGROUND_LOG" || true
              exit 1
            fi

            if curl -sf http://127.0.0.1:2379/pd/api/v1/health > /dev/null 2>&1; then
              if curl -sf http://127.0.0.1:2379/pd/api/v1/stores | grep -Eq '"count"[[:space:]]*:[[:space:]]*[1-9]'; then
                echo "TiKV ready after $i seconds"
                break
              fi
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:2379/pd/api/v1/health || (cat "$PLAYGROUND_LOG" && exit 1)
          curl -sf http://127.0.0.1:2379/pd/api/v1/stores | grep -Eq '"count"[[:space:]]*:[[:space:]]*[1-9]' || (cat "$PLAYGROUND_LOG" && exit 1)

      - name: Start db9-server
        shell: bash
        run: |
          set -euo pipefail

          DB9_LOG=/tmp/db9.log
          rm -f "$DB9_LOG"

          PD_ENDPOINTS=127.0.0.1:2379 \
            PG_PORT=$PG_PORT \
            DB9_BOOTSTRAP_ADMIN_USER="$PG_USER" \
            DB9_BOOTSTRAP_ADMIN_PASSWORD="$PG_PASSWORD" \
            ./target/release/db9-server > "$DB9_LOG" 2>&1 &
          echo "DB9_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -q 2>/dev/null; then
              echo "db9-server ready after $i seconds"
              break
            fi
            sleep 1
          done

          PGPASSWORD=$PG_PASSWORD psql -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -d postgres -c "SELECT 1" || (cat "$DB9_LOG" && exit 1)

      - name: Run GORM smoke tests
        continue-on-error: true
        env:
          PG_DSN: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/postgres?sslmode=disable
        run: bash scripts/e2e_tests.sh gorm_smoke

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gorm-smoke-logs
          path: |
            /tmp/db9.log
            /tmp/tiup-playground.log

  # -- SQLAlchemy Smoke (download binary) -----------------------------------
