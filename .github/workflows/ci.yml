          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

