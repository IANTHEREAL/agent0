name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PG_PORT: 5433
  PG_USER: admin
  PG_PASSWORD: admin
  REDIS_URL: redis://localhost:6379

jobs:
  # -- Build (single release build, shared via artifact) --------------------
  build-release:
    runs-on: arc-runner-amd64-c6i-2xl
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-
      - run: cargo build --release
      - run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/db9-server
          retention-days: 1

  # -- Lint (independent, debug build, no release artifact) -----------------
  lint:
    runs-on: arc-runner-amd64-c6i-xl
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-
      - run: cargo fmt -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # -- Unit Tests (independent, debug build, no release artifact) -----------
  unit-tests:
    runs-on: arc-runner-amd64-c6i-xl
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-
      - run: cargo test

  # -- Regression Gate (download binary, no Rust needed) --------------------
  regression-gate:
    needs: build-release
    runs-on: arc-runner-amd64-c6i-2xl
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: ./.github/actions/setup-tiup

      - name: Run regression gate
        shell: bash
        run: ./scripts/regression_gate.sh --skip-unit --skip-build

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-reports
          path: |
            test-reports/regression-gate-*/
            orm-tests/test-results.json
            /tmp/db9-regression.log

  # -- Integration + ORM Tests (download binary) ---------------------------
  integration-tests:
    needs: build-release
    runs-on: arc-runner-amd64-c6i-2xl
    timeout-minutes: 25
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: runs-on/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: ./.github/actions/setup-tiup
      - uses: ./.github/actions/start-tikv

      - name: Run fs9 symlink format behavioral tests
        shell: bash
        run: |
          PD_ENDPOINTS=127.0.0.1:2379 cargo test test_symlink_creation_bumps_superblock_to_v5 -- --ignored --nocapture
          PD_ENDPOINTS=127.0.0.1:2379 cargo test test_keyspace_without_symlinks_stays_at_v4 -- --ignored --nocapture

      - name: Start db9-server
        run: |
          PD_ENDPOINTS=127.0.0.1:2379 \
            PG_PORT=$PG_PORT \
            DB9_BOOTSTRAP_ADMIN_USER=$PG_USER \
            DB9_BOOTSTRAP_ADMIN_PASSWORD=$PG_PASSWORD \
            ./target/release/db9-server > /tmp/db9.log 2>&1 &
          echo "DB9_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p $PG_PORT -U $PG_USER -q 2>/dev/null; then
              echo "db9-server ready after $i seconds"
              break
            fi
            sleep 1
          done
          PGPASSWORD=$PG_PASSWORD psql -h 127.0.0.1 -p $PG_PORT -U $PG_USER -d postgres -c "SELECT 1" || (cat /tmp/db9.log && exit 1)

      - name: Run integration tests
        run: |
          pip install psycopg2-binary
          python3 scripts/integration_test.py --dsn "postgres://$PG_USER:$PG_PASSWORD@127.0.0.1:$PG_PORT/postgres"

      - name: Install ORM test dependencies
        working-directory: orm-tests
        run: npm ci

      - name: Generate Prisma client
        working-directory: orm-tests
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run ORM tests
        working-directory: orm-tests
        run: npm test
        env:
          PG_DSN: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            orm-tests/test-results.json
            /tmp/db9.log

      - name: Generate test summary
        if: always()
        working-directory: orm-tests
        run: |
          if [ -f test-results.json ]; then
            node -e "
            const results = require('./test-results.json');
            const passed = results.numPassedTests || 0;
            const failed = results.numFailedTests || 0;
            const skipped = results.numPendingTests || 0;
            const total = passed + failed + skipped;

            console.log('## db9-server Test Results');
            console.log('');
            console.log('### ORM Compatibility Tests');
            console.log('');
            console.log('| Metric | Count |');
            console.log('|--------|-------|');
            console.log('| Passed | ' + passed + ' |');
            console.log('| Failed | ' + failed + ' |');
            console.log('| Skipped | ' + skipped + ' |');
            console.log('| Total | ' + total + ' |');
            console.log('');
            console.log('**Pass Rate:** ' + (total > 0 ? ((passed / total) * 100).toFixed(1) : 0) + '%');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "## db9-server Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No test results file found" >> $GITHUB_STEP_SUMMARY
          fi

  # -- GORM Smoke (download binary) ----------------------------------------
  gorm-smoke:
    needs: build-release
    runs-on: arc-runner-amd64-c6i-2xl
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: ./.github/actions/setup-tiup
      - uses: ./.github/actions/start-tikv

      - name: Start db9-server
        shell: bash
        run: |
          set -euo pipefail

          DB9_LOG=/tmp/db9.log
          rm -f "$DB9_LOG"

          PD_ENDPOINTS=127.0.0.1:2379 \
            PG_PORT=$PG_PORT \
            DB9_BOOTSTRAP_ADMIN_USER="$PG_USER" \
            DB9_BOOTSTRAP_ADMIN_PASSWORD="$PG_PASSWORD" \
            ./target/release/db9-server > "$DB9_LOG" 2>&1 &
          echo "DB9_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -q 2>/dev/null; then
              echo "db9-server ready after $i seconds"
              break
            fi
            sleep 1
          done

          PGPASSWORD=$PG_PASSWORD psql -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -d postgres -c "SELECT 1" || (cat "$DB9_LOG" && exit 1)

      - name: Run GORM smoke tests
        continue-on-error: true
        env:
          PG_DSN: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/postgres?sslmode=disable
        run: bash scripts/e2e_tests.sh gorm_smoke

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gorm-smoke-logs
          path: |
            /tmp/db9.log
            /tmp/tiup-playground.log

  # -- SQLAlchemy Smoke (download binary) -----------------------------------
  sqlalchemy-smoke:
    needs: build-release
    runs-on: arc-runner-amd64-c6i-2xl
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: db9-release-binary
          path: target/release/
      - run: chmod +x target/release/db9-server

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - uses: ./.github/actions/setup-tiup
      - uses: ./.github/actions/start-tikv

      - name: Start db9-server
        shell: bash
        run: |
          set -euo pipefail

          PD_ENDPOINTS=127.0.0.1:2379 \
            PG_PORT="$PG_PORT" \
            DB9_BOOTSTRAP_ADMIN_USER="$PG_USER" \
            DB9_BOOTSTRAP_ADMIN_PASSWORD="$PG_PASSWORD" \
            ./target/release/db9-server > /tmp/db9.log 2>&1 &
          echo "DB9_PID=$!" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -q 2>/dev/null; then
              echo "db9-server ready after $i seconds"
              break
            fi
            sleep 1
          done

          PGPASSWORD="$PG_PASSWORD" psql -h 127.0.0.1 -p "$PG_PORT" -U "$PG_USER" -d postgres -c "SELECT 1" || (cat /tmp/db9.log && exit 1)

      - name: Run SQLAlchemy smoke suite
        shell: bash
        run: bash scripts/e2e_tests.sh sqlalchemy_smoke
        env:
          PG_DSN: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/postgres

      - name: Run Dify SQLAlchemy compat suite
        shell: bash
        run: bash scripts/e2e_tests.sh dify_sqlalchemy_compat
        env:
          PG_DSN: postgres://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@127.0.0.1:${{ env.PG_PORT }}/postgres

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlalchemy-smoke-logs
          path: |
            /tmp/tiup-playground.log
            /tmp/db9.log
