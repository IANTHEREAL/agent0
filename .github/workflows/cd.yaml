name: cd

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-dev-image:
    name: Publish Dev ECR Image
    uses: db9-ai/sys9-build/.github/workflows/_sys9-dev-image.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      aws_region: us-west-2
      registry_targets: |
        [
          {
            "name": "deployment",
            "registry": "274703560910.dkr.ecr.us-west-2.amazonaws.com",
            "repository": "sys9/db9",
            "role_arn": "arn:aws:iam::274703560910:role/CICD-Deployment-Role",
            "allowed_account_ids": "274703560910"
          }
        ]
      version_file: VERSION
      dockerfile: ./Dockerfile
      build_context: .
      github_app_client_id: ${{ vars.CI_TRUST_APP_CLIENT_ID }}
      github_app_repositories: |
        db9-server
        db9-auth
    secrets:
      github_app_private_key: ${{ secrets.CI_TRUST_APP_PRIVATE_KEY }}
