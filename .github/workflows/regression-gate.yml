name: Regression Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: orm-tests/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cache TiUP
        uses: actions/cache@v4
        with:
          path: ~/.tiup
          key: ${{ runner.os }}-tiup-v1
          restore-keys: |
            ${{ runner.os }}-tiup-

      - name: Install tiup + playground
        shell: bash
        run: |
          set -euo pipefail

          export TIUP_HOME="$HOME/.tiup"
          echo "TIUP_HOME=$TIUP_HOME" >> "$GITHUB_ENV"

          export PATH="$TIUP_HOME/bin:$PATH"
          echo "$TIUP_HOME/bin" >> "$GITHUB_PATH"

          if command -v tiup >/dev/null 2>&1; then
            if ! tiup list >/dev/null 2>&1; then
              echo "TiUP appears unhealthy; resetting TIUP_HOME..."
              rm -rf "$TIUP_HOME"
            fi
          fi

          if ! command -v tiup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          fi

          for attempt in 1 2 3; do
            if tiup install playground; then
              break
            fi
            echo "tiup install playground failed (attempt $attempt); retrying..."
            sleep $((attempt * 5))
          done

          tiup --version
          tiup list >/dev/null

      - name: Run regression gate
        shell: bash
        run: ./scripts/regression_gate.sh

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-reports
          path: |
            test-reports/regression-gate-*/
            orm-tests/test-results.json
            /tmp/pgtikv-regression.log
