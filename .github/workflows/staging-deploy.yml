name: Server Shared Staging Deploy
run-name: Server Shared Staging Deploy [master]

on:
  workflow_run:
    workflows:
      - Server Image Package
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: server-shared-staging-deploy-master
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "385595570414"
  ECR_REPOSITORY: pg-tikv
  EKS_CLUSTER_NAME: staging-us-west-2-f02
  K8S_NAMESPACE: db9
  K8S_DEPLOYMENT: db9-server
  K8S_CONTAINER: db9-server

jobs:
  deploy:
    name: Deploy server to shared staging [master]
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.DB9_SERVER_IMAGE_PACKAGE_ROLE_ARN }}
    steps:
      - name: Validate AWS role configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::Repository variable DB9_SERVER_IMAGE_PACKAGE_ROLE_ARN must be set for staging-deploy.yml"
            exit 1
          fi

      - name: Resolve image-package run inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${HEAD_SHA:0:12}"
          ARTIFACT_NAME="image-package-server-${SHORT_SHA}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Guard against stale master deploys
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MASTER_SHA="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/master --jq .object.sha)"
          echo "master_head_sha=${MASTER_SHA}" >> "$GITHUB_OUTPUT"
          RUN_SHA="${{ steps.inputs.outputs.head_sha }}"
          if [[ "${MASTER_SHA}" != "${RUN_SHA}" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_run head_sha ${RUN_SHA} is not current master head ${MASTER_SHA}" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping shared staging deploy (not latest master head)"
            echo "- master: ${MASTER_SHA}"
            echo "- run: ${RUN_SHA}"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=" >> "$GITHUB_OUTPUT"

      - name: Download image-package manifest artifact
        if: steps.guard.outputs.should_deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/image-package
          gh run download "${{ steps.inputs.outputs.run_id }}" \
            -R "${GITHUB_REPOSITORY}" \
            -n "${{ steps.inputs.outputs.artifact_name }}" \
            -D dist/image-package
          test -f dist/image-package/manifest.json

      - name: Resolve deploy image ref from manifest
        id: manifest
        if: steps.guard.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          head_sha = os.environ["WORKFLOW_RUN_HEAD_SHA"]
          manifest = json.loads(Path("dist/image-package/manifest.json").read_text(encoding="ascii"))
          required = ["source_sha", "image_ref_digest", "image_ref_tag", "version"]
          missing = [key for key in required if key not in manifest or not manifest[key]]
          if missing:
            raise SystemExit(f"manifest.json missing required keys: {missing}")
          if manifest["source_sha"] != head_sha:
            raise SystemExit(
              "manifest source_sha does not match workflow_run head_sha\n"
              f"- manifest: {manifest['source_sha']}\n"
              f"- workflow_run: {head_sha}\n"
            )
          expected_prefix = (
              f"{os.environ['AWS_ACCOUNT_ID']}.dkr.ecr."
              f"{os.environ['AWS_REGION']}.amazonaws.com/"
              f"{os.environ['ECR_REPOSITORY']}@"
          )
          if not manifest["image_ref_digest"].startswith(expected_prefix):
            raise SystemExit(
              "manifest image_ref_digest does not match the shared staging target\n"
              f"- expected_prefix: {expected_prefix}\n"
              f"- manifest: {manifest['image_ref_digest']}\n"
            )
          print(f"source_sha={manifest['source_sha']}")
          print(f"image_ref_digest={manifest['image_ref_digest']}")
          print(f"image_ref_tag={manifest['image_ref_tag']}")
          print(f"version={manifest['version']}")
          PY
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ steps.inputs.outputs.head_sha }}

      - name: Configure AWS credentials
        if: steps.guard.outputs.should_deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: db9-server-staging-deploy

      - name: Set up kubectl
        if: steps.guard.outputs.should_deploy == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig for staging EKS
        if: steps.guard.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"
          kubectl config current-context

      - name: Capture current shared staging image
        id: current
        if: steps.guard.outputs.should_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREV_IMAGE="$(kubectl -n "${K8S_NAMESPACE}" get "deployment/${K8S_DEPLOYMENT}" -o jsonpath='{.spec.template.spec.containers[?(@.name=="'"${K8S_CONTAINER}"'")].image}')"
          echo "previous_image=${PREV_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Roll out server image to shared staging
        id: rollout
        if: steps.guard.outputs.should_deploy == 'true'
        shell: bash
        env:
          IMAGE_REF_DIGEST: ${{ steps.manifest.outputs.image_ref_digest }}
        run: |
          set -euo pipefail
          kubectl -n "${K8S_NAMESPACE}" set image "deployment/${K8S_DEPLOYMENT}" "${K8S_CONTAINER}=${IMAGE_REF_DIGEST}"
          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${K8S_DEPLOYMENT}" --timeout=10m
          DEPLOYED_IMAGE="$(kubectl -n "${K8S_NAMESPACE}" get "deployment/${K8S_DEPLOYMENT}" -o jsonpath='{.spec.template.spec.containers[?(@.name=="'"${K8S_CONTAINER}"'")].image}')"
          echo "deployed_image=${DEPLOYED_IMAGE}" >> "$GITHUB_OUTPUT"
          if [[ "${DEPLOYED_IMAGE}" != "${IMAGE_REF_DIGEST}" ]]; then
            echo "::error::deployment image mismatch after rollout"
            echo "- expected: ${IMAGE_REF_DIGEST}"
            echo "- actual: ${DEPLOYED_IMAGE}"
            exit 1
          fi

      - name: Roll back failed rollout
        id: rollback
        if: failure() && steps.guard.outputs.should_deploy == 'true' && steps.rollout.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::attempting automatic rollback via kubectl rollout undo"
          kubectl -n "${K8S_NAMESPACE}" rollout undo "deployment/${K8S_DEPLOYMENT}" || true
          kubectl -n "${K8S_NAMESPACE}" rollout status "deployment/${K8S_DEPLOYMENT}" --timeout=10m || true
          ROLLED_BACK_IMAGE="$(kubectl -n "${K8S_NAMESPACE}" get "deployment/${K8S_DEPLOYMENT}" -o jsonpath='{.spec.template.spec.containers[?(@.name=="'"${K8S_CONTAINER}"'")].image}')"
          echo "rolled_back_image=${ROLLED_BACK_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Summarize shared staging deploy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Server Shared Staging Deploy"
            echo ""
            echo "- **Source**: server image-package run ${{ steps.inputs.outputs.run_id }}"
            echo "- **Source SHA**: ${{ steps.inputs.outputs.head_sha }}"
            echo "- **Master HEAD**: ${{ steps.guard.outputs.master_head_sha }}"
            echo "- **Should Deploy**: ${{ steps.guard.outputs.should_deploy }}"
            echo "- **Skip Reason**: ${{ steps.guard.outputs.reason }}"
            echo "- **Version**: ${{ steps.manifest.outputs.version }}"
            echo "- **Image (tag)**: ${{ steps.manifest.outputs.image_ref_tag }}"
            echo "- **Image (digest)**: ${{ steps.manifest.outputs.image_ref_digest }}"
            echo "- **Previous Image**: ${{ steps.current.outputs.previous_image }}"
            echo "- **Deployed Image**: ${{ steps.rollout.outputs.deployed_image }}"
            echo "- **Rolled Back Image**: ${{ steps.rollback.outputs.rolled_back_image }}"
            echo "- **Health Gate**: kubectl rollout status only"
            echo "- **Cluster**: ${EKS_CLUSTER_NAME}"
            echo "- **Namespace**: ${K8S_NAMESPACE}"
            echo "- **Deployment**: ${K8S_DEPLOYMENT}"
          } >> "$GITHUB_STEP_SUMMARY"
