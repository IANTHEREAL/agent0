name: Server Image Package
run-name: Server Image Package [master]

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'DIFY_COMPATIBILITY.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/workflows/governance-lint.yml'
      - '.github/workflows/doc-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: server-image-package-master
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "385595570414"
  ECR_REPOSITORY: pg-tikv
  IMAGE_COMPONENT: db9-server
  DOCKERFILE_PATH: Dockerfile
  DOCKER_PLATFORM: linux/arm64

jobs:
  image-package:
    name: Package server image [master]
    runs-on: ubuntu-24.04-arm
    env:
      AWS_ROLE_TO_ASSUME: ${{ vars.DB9_SERVER_IMAGE_PACKAGE_ROLE_ARN }}
    steps:
      - name: Reject manual dispatches from non-master refs
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'master'
        run: |
          echo "::error::Server image packaging always runs against master. Re-run workflow_dispatch from master."
          echo "## Server Image Package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Workflow ref**: ${GITHUB_REF}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result**: rejected because workflow_dispatch was not started from master" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout source payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve packaging metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_BRANCH="master"
          SOURCE_REF="refs/heads/${SOURCE_BRANCH}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          IMAGE_REPOSITORY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE_TAG="sha-${SOURCE_SHORT_SHA}"
          IMAGE_REF_TAG="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          MANIFEST_DIR="dist/image-package/server"
          ARTIFACT_NAME="image-package-server-${SOURCE_SHORT_SHA}"
          BUILT_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          mkdir -p "${MANIFEST_DIR}"

          echo "source_branch=${SOURCE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_short_sha=${SOURCE_SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref_tag=${IMAGE_REF_TAG}" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=${MANIFEST_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT_AT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "## Server Image Package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Payload branch**: ${SOURCE_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Payload SHA**: ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image repository**: ${IMAGE_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Immutable tag**: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate AWS role configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ROLE_TO_ASSUME}" ]]; then
            echo "::error::Repository variable DB9_SERVER_IMAGE_PACKAGE_ROLE_ARN must be set for image-package.yml"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: db9-server-image-package

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push server image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./${{ env.DOCKERFILE_PATH }}
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.image_ref_tag }}
          build-args: |
            BUILD_GIT_HASH=${{ steps.meta.outputs.source_sha }}
            BUILD_DATE=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify digest exists in ECR
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          aws ecr describe-images \
            --registry-id "${AWS_ACCOUNT_ID}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageDigest="${IMAGE_DIGEST}" \
            >/dev/null

      - name: Write manifest artifact
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "manifest_version": 1,
              "component": os.environ["IMAGE_COMPONENT"],
              "source_branch": os.environ["SOURCE_BRANCH"],
              "source_ref": os.environ["SOURCE_REF"],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_short_sha": os.environ["SOURCE_SHORT_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "workflow_event": os.environ["GITHUB_EVENT_NAME"],
              "version": os.environ["VERSION"],
              "image_repository": os.environ["IMAGE_REPOSITORY"],
              "image_tag": os.environ["IMAGE_TAG"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "image_ref_tag": os.environ["IMAGE_REF_TAG"],
              "image_ref_digest": os.environ["IMAGE_REF_DIGEST"],
              "platform": os.environ["DOCKER_PLATFORM"],
              "dockerfile": os.environ["DOCKERFILE_PATH"],
              "aws_region": os.environ["AWS_REGION"],
              "built_at": os.environ["BUILT_AT"],
          }

          manifest_dir = Path(os.environ["MANIFEST_DIR"])
          manifest_dir.mkdir(parents=True, exist_ok=True)
          (manifest_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="ascii",
          )
          PY
        env:
          SOURCE_BRANCH: ${{ steps.meta.outputs.source_branch }}
          SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          SOURCE_SHORT_SHA: ${{ steps.meta.outputs.source_short_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF_TAG: ${{ steps.meta.outputs.image_ref_tag }}
          IMAGE_REF_DIGEST: ${{ steps.meta.outputs.image_repository }}@${{ steps.build.outputs.digest }}
          MANIFEST_DIR: ${{ steps.meta.outputs.manifest_dir }}
          BUILT_AT: ${{ steps.meta.outputs.built_at }}

      - name: Upload image-package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.manifest_dir }}/manifest.json
          retention-days: 7

      - name: Summarize image package result
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Published Image" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest**: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest ref**: ${{ steps.meta.outputs.image_repository }}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag ref**: ${{ steps.meta.outputs.image_ref_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Manifest artifact**: ${{ steps.meta.outputs.artifact_name }}" >> "$GITHUB_STEP_SUMMARY"
