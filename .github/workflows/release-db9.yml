name: Build db9 binaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud-admin-portal/backend/src/db9.rs'
      - 'cloud-admin-portal/backend/src/cli_common.rs'
      - 'cloud-admin-portal/backend/Cargo.toml'
      - '.github/workflows/release-db9.yml'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: db9-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: db9-linux-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: db9-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: db9-darwin-arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cloud-admin-portal/backend

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --bin db9 --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/db9 ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cloud-admin-portal/backend/${{ matrix.artifact }}
