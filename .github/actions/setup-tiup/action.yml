name: Setup TiUP
description: Install TiUP CLI and playground component with caching

inputs:
  tiup-version:
    description: TiUP release tag
    required: false
    default: v1.16.4

runs:
  using: composite
  steps:
    - name: Cache TiUP
      uses: actions/cache@v4
      id: tiup-cache
      with:
        path: ~/.tiup
        key: ${{ runner.os }}-tiup-${{ inputs.tiup-version }}

    - name: Install TiUP
      shell: bash
      env:
        TIUP_VERSION: ${{ inputs.tiup-version }}
      run: |
        set -euo pipefail

        export TIUP_HOME="$HOME/.tiup"
        echo "TIUP_HOME=$TIUP_HOME" >> "$GITHUB_ENV"
        echo "$TIUP_HOME/bin" >> "$GITHUB_PATH"
        export PATH="$TIUP_HOME/bin:$PATH"

        # If cache restored, verify TiUP is healthy
        if [[ "${{ steps.tiup-cache.outputs.cache-hit }}" == "true" ]]; then
          if command -v tiup >/dev/null 2>&1 && tiup list >/dev/null 2>&1; then
            echo "TiUP restored from cache and healthy"
            # Ensure playground is installed
            timeout 60 tiup install playground 2>/dev/null || true
            tiup --version
            exit 0
          fi
          echo "Cached TiUP is unhealthy; reinstalling..."
          rm -rf "$TIUP_HOME"
        fi

        install_tiup() {
          rm -rf "$TIUP_HOME"
          mkdir -p "$TIUP_HOME"

          local arch
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported architecture: $arch" >&2; return 1 ;;
          esac

          local url="https://github.com/pingcap/tiup/releases/download/${TIUP_VERSION}/tiup-${TIUP_VERSION}-linux-${arch}.tar.gz"

          if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 -o /tmp/tiup.tar.gz "$url" \
            && tar -zxf /tmp/tiup.tar.gz -C "$TIUP_HOME"; then
            rm -f /tmp/tiup.tar.gz
          else
            rm -f /tmp/tiup.tar.gz
            rm -rf "$TIUP_HOME"
            mkdir -p "$TIUP_HOME"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors --connect-timeout 10 --max-time 120 \
              https://tiup-mirrors.pingcap.com/install.sh | sh
          fi

          tiup --version
          tiup list >/dev/null
          timeout 60 tiup install playground
        }

        for attempt in 1 2 3; do
          echo "Installing TiUP (attempt $attempt)..."
          if install_tiup; then
            break
          fi
          echo "TiUP install failed; retrying..."
          sleep $((attempt * 5))
        done

        tiup --version
