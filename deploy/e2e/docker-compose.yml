# Local E2E Integration Test Environment
#
# Services:
#   postgres      — metadata DB for db9-admin
#   pd            — TiKV Placement Driver (single node)
#   tikv          — TiKV server (single node, API v2)
#   db9-server       — db9-server (db9) PostgreSQL-compatible frontend  :5433
#   fs9-meta      — FS9 metadata / auth service                    :9998
#   fs9-server    — FS9 HTTP API with pagefs/TiKV backend          :9999
#   db9-admin  — cloud-admin-portal backend + db9 binary        :8090
#
# Setup:
#   cp .env.example .env          # set FS9_REPO_PATH and secrets
#   docker compose up -d --build
#
# Run db9 via exec (db9 binary lives inside the db9-admin container):
#   docker compose exec db9-admin db9 --api-url http://localhost:8090/api login
#   docker compose exec db9-admin db9 --api-url http://localhost:8090/api db create --name hello
#   docker compose exec db9-admin db9 --api-url http://localhost:8090/api db list
#   docker compose exec db9-admin db9 --api-url http://localhost:8090/api sh <id>
#
# Or from the host (with db9 binary installed locally):
#   export DB9_API_URL=http://localhost:8090/api
#   db9 db create --name hello

name: db9-e2e

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: db9_admin
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db9_admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── TiKV Placement Driver ──────────────────────────────────────────────────
  pd:
    image: pingcap/pd:latest
    volumes:
      - pd-data:/data/pd
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2379/pd/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ─── TiKV server (API v2, single node) ─────────────────────────────────────
  tikv:
    image: pingcap/tikv:latest
    depends_on:
      pd:
        condition: service_healthy
    volumes:
      - tikv-data:/data/tikv
      - ./config/tikv.toml:/etc/tikv/tikv.toml:ro
    command:
      - --pd-endpoints=pd:2379
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --data-dir=/data/tikv
      - --config=/etc/tikv/tikv.toml
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:20180/metrics > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ─── db9-server (db9) ─────────────────────────────────────────────────────────
  # Build context: db9 repo root; Dockerfile path is relative to that context.
  db9-server:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile.db9-server
    depends_on:
      tikv:
        condition: service_healthy
    environment:
      PD_ENDPOINTS: pd:2379
      PG_LISTEN_ADDR: 0.0.0.0
      PG_PORT: 5433
      DB9_INSECURE: "1"
      # Bootstrap the initial superuser with password "admin" so db9-admin
      # can connect (it uses DEFAULT_ADMIN_USER="admin", DEFAULT_ADMIN_PASSWORD="admin"
      # for new keyspaces).  Do NOT set DB9_BOOTSTRAP_ADMIN_USER — the default
      # is "admin", which matches DEFAULT_ADMIN_USER in db9-admin.
      DB9_BOOTSTRAP_ADMIN_PASSWORD: admin
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/5433'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ─── fs9-meta ────────────────────────────────────────────────────────────────
  # Build context: fs9 repo (set FS9_REPO_PATH in .env).
  fs9-meta:
    build:
      context: ${FS9_REPO_PATH}
      dockerfile: docker/Dockerfile.meta
    environment:
      FS9_META_HOST: "0.0.0.0"
      FS9_META_PORT: "9998"
      FS9_JWT_SECRET: ${FS9_JWT_SECRET}
      FS9_META_KEY: ${FS9_META_KEY}
      FS9_META_DB: "sqlite:///./data/fs9_meta.db"
    volumes:
      - fs9-meta-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9998/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ─── fs9-server (pagefs / TiKV backend) ─────────────────────────────────────
  # Built with --features tikv so the pagefs plugin uses TiKV as backing store.
  # Dockerfile.server-e2e lives inside the fs9 repo (docker/Dockerfile.server-e2e).
  fs9-server:
    build:
      context: ${FS9_REPO_PATH}
      dockerfile: docker/Dockerfile.server-e2e
    depends_on:
      fs9-meta:
        condition: service_healthy
      tikv:
        condition: service_healthy
    environment:
      FS9_HOST: "0.0.0.0"
      FS9_PORT: "9999"
      FS9_JWT_SECRET: ${FS9_JWT_SECRET}
      FS9_META_ENDPOINTS: http://fs9-meta:9998
      FS9_META_KEY: ${FS9_META_KEY}
      FS9_PLUGIN_DIR: /app/plugins
      FS9_CONFIG: /config/fs9-server.yaml
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config/fs9-server.yaml:/config/fs9-server.yaml:ro
    ports:
      - "9999:9999"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ─── db9-admin + db9 ──────────────────────────────────────────────────────
  # Build context: db9 repo root (same as db9-server) so Dockerfile.admin can
  # reference cloud-admin-portal/backend/ paths.
  db9-admin:
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile.admin
      additional_contexts:
        fs9: ${FS9_REPO_PATH}
    depends_on:
      postgres:
        condition: service_healthy
      db9-server:
        condition: service_healthy
      fs9-meta:
        condition: service_healthy
    environment:
      DB9_PD_ENDPOINTS: pd:2379
      DB9_PG_HOST: db9-server
      DB9_PG_PORT: "5433"
      DB9_PG_PUBLIC_ENDPOINTS: "127.0.0.1:5433"
      DB9_API_PORT: "8090"
      DB9_API_HOST: "0.0.0.0"
      DB9_DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/db9_admin
      DB9_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      DB9_API_KEYS: ${DB9_API_KEYS:-}
      FS9_META_URL: http://fs9-meta:9998
      FS9_META_KEY: ${FS9_META_KEY}
      FS9_JWT_SECRET: ${FS9_JWT_SECRET}
      FS9_SERVER_URL: http://fs9-server:9999
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/api/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
  pd-data:
  tikv-data:
  fs9-meta-data:
