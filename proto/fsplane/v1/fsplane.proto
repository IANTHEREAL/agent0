syntax = "proto3";

package fsplane.v1;

option go_package = "github.com/db9-ai/fs9/gen/fsplane/v1;fsplanev1";

// FsPlane is a thin gRPC proxy wrapping JuiceFS pkg/fs.FileSystem.
//
// It serves db9-server (Rust) as its only client over a Unix domain socket.
// The proxy holds no business logic — no CAS, no generation tracking, no
// idempotency, no authz. All intelligence stays in db9-server.
//
// Each RPC is self-contained: the proxy opens a JuiceFS file handle internally,
// performs the operation, optionally flushes, closes the handle, and returns.
// No file handles are exposed over the wire.
//
// Error mapping: JuiceFS syscall.Errno → gRPC status codes.
// The numeric errno is embedded in the status message as "[errno=N]"
// (e.g. "path: is a directory [errno=21]"). db9-server parses this for
// precise error mapping; the gRPC status code is a coarse fallback.
//
//   ENOENT (2)      → NOT_FOUND
//   EACCES (13)     → PERMISSION_DENIED
//   EEXIST (17)     → ALREADY_EXISTS
//   ENOTDIR (20)    → FAILED_PRECONDITION
//   EISDIR (21)     → FAILED_PRECONDITION
//   EINVAL (22)     → INVALID_ARGUMENT
//   ENOSPC (28)     → RESOURCE_EXHAUSTED
//   ENOTEMPTY (39)  → FAILED_PRECONDITION
//   EIO (5)         → INTERNAL
//   other           → UNKNOWN
service FsPlane {
  // --- Volume lifecycle ---

  // InitVolume connects to an existing JuiceFS volume and initializes the
  // in-process FileSystem instance. The volume must be pre-formatted with
  // `juicefs format`. Idempotent: returns success if already initialized.
  rpc InitVolume(InitVolumeRequest) returns (InitVolumeResponse);

  // CloseVolume disconnects from a volume, flushes pending data, closes
  // the meta session, and frees memory.
  rpc CloseVolume(CloseVolumeRequest) returns (CloseVolumeResponse);

  // --- Data reads ---

  // ReadAt reads a byte range from a file and streams the result in chunks.
  // If length is 0, reads from offset to end of file.
  rpc ReadAt(ReadAtRequest) returns (stream ReadAtResponse);

  // Stat returns file metadata (size, mtime, mode).
  rpc Stat(StatRequest) returns (StatResponse);

  // --- Data mutations ---
  //
  // Write paths (see db9-ai/fs9#6):
  //   * PutFile  — unary; ≤ 4 MiB; REPLACE | CREATE_ONLY | APPEND
  //   * BeginWrite / WriteParts / CommitWrite / AbortWrite — streaming + explicit
  //     commit; any size; REPLACE | CREATE_ONLY | APPEND
  //   * WriteAt  — unary; partial overwrite at offset on existing file
  //
  // Commit is always an explicit unary RPC (CommitWrite or PutFile return) —
  // never the wire-level end-of-stream. Dropping a WriteParts stream mid-upload
  // leaves the upload OPEN; only TTL expiry or AbortWrite reclaims it.

  // PutFile creates / replaces / appends a file in a single unary RPC.
  // Server rejects requests with len(data) > 4 MiB (clients must use multipart).
  rpc PutFile(PutFileRequest) returns (PutFileResponse);

  // BeginWrite opens a multipart upload session. Returns an opaque upload_id
  // that the caller uses for WriteParts / CommitWrite / AbortWrite.
  rpc BeginWrite(BeginWriteRequest) returns (BeginWriteResponse);

  // WriteParts streams data into an open upload. Single-writer per upload_id
  // by construction (one streaming RPC == one writer). offset in each
  // WritePartRequest MUST equal the server's cumulative bytes_received.
  // Stream EOS means "data phase done, awaiting CommitWrite" — NOT commit.
  rpc WriteParts(stream WritePartRequest) returns (WritePartsResponse);

  // CommitWrite publishes the multipart upload atomically (temp + rename for
  // REPLACE / CREATE_ONLY; flock + seek-end + write for APPEND). Idempotent
  // within the server's receipt retention window.
  rpc CommitWrite(CommitWriteRequest) returns (CommitWriteResponse);

  // AbortWrite discards an upload. Idempotent; safe on terminal sessions;
  // TTL is the authoritative backstop if the client never calls this.
  rpc AbortWrite(AbortWriteRequest) returns (AbortWriteResponse);

  // WriteAt writes data at a specific offset on an existing file. Does not
  // truncate. Unary — for bounded regions up to 4 MiB.
  rpc WriteAt(WriteAtRequest) returns (WriteAtResponse);

  // Truncate changes file size. Smaller = discard. Larger = zero-extend.
  rpc Truncate(TruncateRequest) returns (TruncateResponse);

  // --- Directory ---

  // Readdir lists entries in a directory.
  rpc Readdir(ReaddirRequest) returns (ReaddirResponse);

  // --- File/directory lifecycle ---

  // Delete removes a file or empty directory.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Mkdir creates a directory. Supports recursive creation.
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);

  // Rename moves/renames a file or directory.
  rpc Rename(RenameRequest) returns (RenameResponse);

  // Symlink creates a symbolic link.
  rpc Symlink(SymlinkRequest) returns (SymlinkResponse);

  // Readlink returns the target of a symbolic link.
  rpc Readlink(ReadlinkRequest) returns (ReadlinkResponse);

  // Chmod changes file/directory permissions.
  rpc Chmod(ChmodRequest) returns (ChmodResponse);

  // --- Clone safety ---

  // AdvanceNextChunk advances the JuiceFS nextChunk counter by the given offset.
  // Must be called after TiKV BR clone to prevent slice ID collision between
  // the original and cloned volumes.
  rpc AdvanceNextChunk(AdvanceNextChunkRequest) returns (AdvanceNextChunkResponse);

  // --- Flush ---

  // Flush forces buffered writes for a file to be committed.
  // Only meaningful when prior mutations used flush=false (batch mode).
  rpc Flush(FlushRequest) returns (FlushResponse);

  // --- Health ---

  // Ping is a liveness check.
  rpc Ping(PingRequest) returns (PingResponse);
}

// =============================================================================
// Volume lifecycle
// =============================================================================

message InitVolumeRequest {
  string volume_id = 1;
  // JuiceFS meta URL, e.g.:
  // "tikv://pd:2379?keyspace=jfs_t_{tenant}&gc-interval=0&ca=...&cert=...&key=..."
  string meta_url = 2;
  // Chunk cache size in MB. 0 = use server default.
  uint32 cache_size_mb = 3;
}

message InitVolumeResponse {
  // True if newly initialized, false if already active.
  bool created = 1;
}

message CloseVolumeRequest {
  string volume_id = 1;
}

message CloseVolumeResponse {}

// =============================================================================
// Reads
// =============================================================================

message ReadAtRequest {
  string volume_id = 1;
  string path = 2;
  uint64 offset = 3;
  // 0 = read to end of file.
  uint64 length = 4;
}

message ReadAtResponse {
  bytes data = 1;
  // Total file size. Set only on the first chunk; 0 on subsequent.
  uint64 file_size = 2;
}

message StatRequest {
  string volume_id = 1;
  string path = 2;
}

message StatResponse {
  uint64 size = 1;
  // Last modification time as Unix milliseconds.
  int64 mtime_ms = 2;
  uint32 mode = 3;
  bool is_dir = 4;
}

message ReaddirRequest {
  string volume_id = 1;
  string path = 2;
}

message ReaddirResponse {
  repeated DirEntry entries = 1;
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size = 3;
  int64 mtime_ms = 4;
  uint32 mode = 5;
}

// =============================================================================
// Mutations
// =============================================================================

// WriteMode selects the publish semantic at CommitWrite / PutFile time.
enum WriteMode {
  WRITE_MODE_UNSPECIFIED = 0;
  // REPLACE: atomic rename-over target.
  WRITE_MODE_REPLACE     = 1;
  // CREATE_ONLY: atomic rename with RENAME_NOREPLACE; ALREADY_EXISTS on
  // collision at commit.
  WRITE_MODE_CREATE_ONLY = 2;
  // APPEND: concat to existing target under flock at commit.
  WRITE_MODE_APPEND      = 3;
}

message PutFileRequest {
  string volume_id = 1;
  string path      = 2;
  WriteMode mode   = 3;
  uint32 file_mode = 4;
  uint32 umask     = 5;
  // Payload. Server MUST reject if > 4 MiB (use BeginWrite/WriteParts/CommitWrite
  // for anything larger).
  bytes data       = 6;
  reserved 7 to 10;
}

message PutFileResponse {
  uint64 new_size = 1;
}

message BeginWriteRequest {
  string volume_id = 1;
  string path      = 2;
  WriteMode mode   = 3;
  uint32 file_mode = 4;
  uint32 umask     = 5;
  // Optional upper bound on total bytes. Server fast-fails at WritePart when
  // cumulative would exceed this; re-checked at Commit.
  optional uint64 expected_size = 6;
  reserved 7 to 15;  // future: encryption, content-type, hints
}

message BeginWriteResponse {
  // Opaque, 128-bit random, unguessable.
  string upload_id       = 1;
  // Recommended max bytes per WritePartRequest.data. Default 4 MiB.
  uint64 part_size_hint  = 2;
  // NO expires_at — server is authoritative on TTL; client must not compute
  // "time remaining" from a wire value (clock skew hazard).
}

message WritePartRequest {
  string upload_id = 1;
  // MUST equal the server's cumulative bytes_received; FAILED_PRECONDITION
  // otherwise. Strict in-order, no gaps, no overlap.
  uint64 offset    = 2;
  bytes  data      = 3;
  // Reserved: per-part crc32c. DO NOT add without evidence of silent
  // corruption on the proxy transport; gRPC/TLS/UDS already provide
  // end-to-end integrity, and a per-part CRC mutates the hot path.
  reserved 4;
  reserved 5 to 8;
}

message WritePartsResponse {
  // Cumulative bytes successfully staged by this stream.
  uint64 bytes_received = 1;
}

message CommitWriteRequest {
  string upload_id  = 1;
  // MUST equal server bytes_received; FAILED_PRECONDITION otherwise.
  uint64 total_size = 2;
  reserved 3 to 7;  // future: whole-file checksum
}

message CommitWriteResponse {
  uint64 new_size = 1;
}

message AbortWriteRequest  { string upload_id = 1; }
message AbortWriteResponse {}

message WriteAtRequest {
  string volume_id = 1;
  string path = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool flush = 5;
}

message WriteAtResponse {
  uint64 bytes_written = 1;
  uint64 new_size = 2;
}

message TruncateRequest {
  string volume_id = 1;
  string path = 2;
  uint64 size = 3;
}

message TruncateResponse {}

// =============================================================================
// File/directory lifecycle
// =============================================================================

message DeleteRequest {
  string volume_id = 1;
  string path = 2;
}

message DeleteResponse {}

message MkdirRequest {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
  uint32 umask = 4;
  bool recursive = 5;
}

message MkdirResponse {}

message RenameRequest {
  string volume_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameResponse {}

message SymlinkRequest {
  string volume_id = 1;
  string target = 2;
  string link = 3;
}

message SymlinkResponse {}

message ReadlinkRequest {
  string volume_id = 1;
  string path = 2;
}

message ReadlinkResponse {
  string target = 1;
}

message ChmodRequest {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
}

message ChmodResponse {}

message AdvanceNextChunkRequest {
  string volume_id = 1;
  // Number to add to the nextChunk counter. Use 1<<40 (1099511627776) for
  // standard clone safety margin.
  int64 offset = 2;
}

message AdvanceNextChunkResponse {
  // The new value of the nextChunk counter after advancing.
  int64 new_value = 1;
  // The old value before advancing.
  int64 old_value = 2;
}

// =============================================================================
// Flush
// =============================================================================

message FlushRequest {
  string volume_id = 1;
  string path = 2;
}

message FlushResponse {}

// =============================================================================
// Health
// =============================================================================

message PingRequest {}

message PingResponse {
  uint32 active_volumes = 1;
  uint64 rss_bytes = 2;
}
