syntax = "proto3";

package fsplane.v1;

option go_package = "github.com/db9-ai/fs9/gen/fsplane/v1;fsplanev1";

// FsPlane is a thin gRPC proxy wrapping JuiceFS pkg/fs.FileSystem.
//
// It serves db9-server (Rust) as its only client over a Unix domain socket.
// The proxy holds no business logic — no CAS, no generation tracking, no
// idempotency, no authz. All intelligence stays in db9-server.
//
// Each RPC is self-contained: the proxy opens a JuiceFS file handle internally,
// performs the operation, optionally flushes, closes the handle, and returns.
// No file handles are exposed over the wire.
//
// Error mapping: JuiceFS syscall.Errno → gRPC status codes.
// The numeric errno is embedded in the status message as "[errno=N]"
// (e.g. "path: is a directory [errno=21]"). db9-server parses this for
// precise error mapping; the gRPC status code is a coarse fallback.
//
//   ENOENT (2)      → NOT_FOUND
//   EACCES (13)     → PERMISSION_DENIED
//   EEXIST (17)     → ALREADY_EXISTS
//   ENOTDIR (20)    → FAILED_PRECONDITION
//   EISDIR (21)     → FAILED_PRECONDITION
//   EINVAL (22)     → INVALID_ARGUMENT
//   ENOSPC (28)     → RESOURCE_EXHAUSTED
//   ENOTEMPTY (39)  → FAILED_PRECONDITION
//   EIO (5)         → INTERNAL
//   other           → UNKNOWN
service FsPlane {
  // --- Volume lifecycle ---

  // InitVolume connects to an existing JuiceFS volume and initializes the
  // in-process FileSystem instance. The volume must be pre-formatted with
  // `juicefs format`. Idempotent: returns success if already initialized.
  rpc InitVolume(InitVolumeRequest) returns (InitVolumeResponse);

  // CloseVolume disconnects from a volume, flushes pending data, closes
  // the meta session, and frees memory.
  rpc CloseVolume(CloseVolumeRequest) returns (CloseVolumeResponse);

  // --- Data reads ---

  // ReadAt reads a byte range from a file and streams the result in chunks.
  // If length is 0, reads from offset to end of file.
  rpc ReadAt(ReadAtRequest) returns (stream ReadAtResponse);

  // Stat returns file metadata (size, mtime, mode).
  rpc Stat(StatRequest) returns (StatResponse);

  // --- Data mutations ---

  // WriteFile creates or fully replaces a file from a stream of chunks.
  // First message MUST contain the header. Subsequent messages carry data only.
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);

  // WriteAt writes data at a specific offset. Does not truncate the file.
  // If offset is beyond file size, JuiceFS zero-fills the gap (POSIX).
  // Unary — for bounded regions up to ~4MB.
  rpc WriteAt(WriteAtRequest) returns (WriteAtResponse);

  // Append appends data to the end of a file via streaming.
  // First message MUST contain the header. Subsequent messages carry data.
  rpc Append(stream AppendRequest) returns (AppendResponse);

  // Truncate changes file size. Smaller = discard. Larger = zero-extend.
  rpc Truncate(TruncateRequest) returns (TruncateResponse);

  // --- Directory ---

  // Readdir lists entries in a directory.
  rpc Readdir(ReaddirRequest) returns (ReaddirResponse);

  // --- File/directory lifecycle ---

  // Delete removes a file or empty directory.
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Mkdir creates a directory. Supports recursive creation.
  rpc Mkdir(MkdirRequest) returns (MkdirResponse);

  // Rename moves/renames a file or directory.
  rpc Rename(RenameRequest) returns (RenameResponse);

  // Symlink creates a symbolic link.
  rpc Symlink(SymlinkRequest) returns (SymlinkResponse);

  // Readlink returns the target of a symbolic link.
  rpc Readlink(ReadlinkRequest) returns (ReadlinkResponse);

  // Chmod changes file/directory permissions.
  rpc Chmod(ChmodRequest) returns (ChmodResponse);

  // --- Clone safety ---

  // AdvanceNextChunk advances the JuiceFS nextChunk counter by the given offset.
  // Must be called after TiKV BR clone to prevent slice ID collision between
  // the original and cloned volumes.
  rpc AdvanceNextChunk(AdvanceNextChunkRequest) returns (AdvanceNextChunkResponse);

  // --- Flush ---

  // Flush forces buffered writes for a file to be committed.
  // Only meaningful when prior mutations used flush=false (batch mode).
  rpc Flush(FlushRequest) returns (FlushResponse);

  // --- Health ---

  // Ping is a liveness check.
  rpc Ping(PingRequest) returns (PingResponse);
}

// =============================================================================
// Volume lifecycle
// =============================================================================

message InitVolumeRequest {
  string volume_id = 1;
  // JuiceFS meta URL, e.g.:
  // "tikv://pd:2379?keyspace=jfs_t_{tenant}&gc-interval=0&ca=...&cert=...&key=..."
  string meta_url = 2;
  // Chunk cache size in MB. 0 = use server default.
  uint32 cache_size_mb = 3;
}

message InitVolumeResponse {
  // True if newly initialized, false if already active.
  bool created = 1;
}

message CloseVolumeRequest {
  string volume_id = 1;
}

message CloseVolumeResponse {}

// =============================================================================
// Reads
// =============================================================================

message ReadAtRequest {
  string volume_id = 1;
  string path = 2;
  uint64 offset = 3;
  // 0 = read to end of file.
  uint64 length = 4;
}

message ReadAtResponse {
  bytes data = 1;
  // Total file size. Set only on the first chunk; 0 on subsequent.
  uint64 file_size = 2;
}

message StatRequest {
  string volume_id = 1;
  string path = 2;
}

message StatResponse {
  uint64 size = 1;
  // Last modification time as Unix milliseconds.
  int64 mtime_ms = 2;
  uint32 mode = 3;
  bool is_dir = 4;
}

message ReaddirRequest {
  string volume_id = 1;
  string path = 2;
}

message ReaddirResponse {
  repeated DirEntry entries = 1;
}

message DirEntry {
  string name = 1;
  bool is_dir = 2;
  uint64 size = 3;
  int64 mtime_ms = 4;
  uint32 mode = 5;
}

// =============================================================================
// Mutations
// =============================================================================

message WriteFileRequest {
  // Header — set only in the first message of the stream.
  WriteFileHeader header = 1;
  bytes data = 2;
}

message WriteFileHeader {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
  uint32 umask = 4;
  // If true, fail with ALREADY_EXISTS when file exists (O_EXCL).
  bool create_only = 5;
  // If true, flush before close (durable). If false, buffer (batch mode).
  bool flush = 6;
}

message WriteFileResponse {
  uint64 new_size = 1;
}

message WriteAtRequest {
  string volume_id = 1;
  string path = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool flush = 5;
}

message WriteAtResponse {
  uint64 bytes_written = 1;
  uint64 new_size = 2;
}

message AppendRequest {
  // Header — set only in the first message of the stream.
  AppendHeader header = 1;
  bytes data = 2;
}

message AppendHeader {
  string volume_id = 1;
  string path = 2;
  bool flush = 3;
}

message AppendResponse {
  uint64 bytes_written = 1;
  uint64 new_size = 2;
}

message TruncateRequest {
  string volume_id = 1;
  string path = 2;
  uint64 size = 3;
}

message TruncateResponse {}

// =============================================================================
// File/directory lifecycle
// =============================================================================

message DeleteRequest {
  string volume_id = 1;
  string path = 2;
}

message DeleteResponse {}

message MkdirRequest {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
  uint32 umask = 4;
  bool recursive = 5;
}

message MkdirResponse {}

message RenameRequest {
  string volume_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message RenameResponse {}

message SymlinkRequest {
  string volume_id = 1;
  string target = 2;
  string link = 3;
}

message SymlinkResponse {}

message ReadlinkRequest {
  string volume_id = 1;
  string path = 2;
}

message ReadlinkResponse {
  string target = 1;
}

message ChmodRequest {
  string volume_id = 1;
  string path = 2;
  uint32 mode = 3;
}

message ChmodResponse {}

message AdvanceNextChunkRequest {
  string volume_id = 1;
  // Number to add to the nextChunk counter. Use 1<<40 (1099511627776) for
  // standard clone safety margin.
  int64 offset = 2;
}

message AdvanceNextChunkResponse {
  // The new value of the nextChunk counter after advancing.
  int64 new_value = 1;
  // The old value before advancing.
  int64 old_value = 2;
}

// =============================================================================
// Flush
// =============================================================================

message FlushRequest {
  string volume_id = 1;
  string path = 2;
}

message FlushResponse {}

// =============================================================================
// Health
// =============================================================================

message PingRequest {}

message PingResponse {
  uint32 active_volumes = 1;
  uint64 rss_bytes = 2;
}
