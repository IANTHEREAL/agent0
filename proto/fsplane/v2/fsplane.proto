// =============================================================================
// Events
// =============================================================================
//
// Subscribe delivers mutation events over a server-streaming RPC backed by
// Redis Streams (fs9 publishes, db9-server consumes). Resume semantics:
//
//   - `since_event_id = ""`  → tail from now (current high-water mark).
//   - `since_event_id = X`   → resume from just after X. If X is older
//                              than server retention (≥ 4 h, SEGMENT_TTL_SECS
//                              = 14400 in redis_events.rs:37), the server
//                              emits a terminal WatchEvent with
//                              error.context["reason"] =
//                              "resume_beyond_retention" and closes the
//                              stream. Client MUST cold-resync before
//                              re-subscribing.
//
// Scope: whole-volume. Client-side filtering is the only supported
// filter; server-side path-prefix filtering is not part of the v2
// contract (evidence: no consumer today; per-event string-compare
// over Redis is non-free). If a real consumer needs it, a future field
// gets added with a fresh number.
//
// Heartbeat: the server emits a WatchEvent{heartbeat} at least every 30 s
// when no events are produced. Heartbeats carry `last_event_id` so idle
// clients can advance their cursor without blocking on a real event.
//
// Exactly one emitter per tenant at any time (fs_v4.md §6.1).

message SubscribeRequest {
  string volume_id = 1;
  // Resume token. Format: Redis Streams ID `<ms>-<seq>`. Server MUST
  // reject malformed values with FsError{code: INVALID_ARGUMENT}; empty
  // string means "tail from now".
  string since_event_id = 2;

  // Optional server-side path-prefix filter. Empty = whole volume.
  // Evidence: db9-server notify.rs:265 `query(... path_prefix: Option<&str>, ...)`
  // is the existing in-process consumer shape. Server validates: no `..`,
  // no absolute paths escaping the volume root; malformed →
  // FsError{code: INVALID_ARGUMENT}. Performance: per-event string-compare
  // over the Redis Streams consumer — acceptable for anchored prefixes
  // (most queries start with `/`); pathological leading-`*` patterns are
  // forbidden.
  optional string path_prefix = 3;
}

message WatchEvent {
  oneof kind {
    FsEvent   event     = 1;
    Heartbeat heartbeat = 2;
    // Terminal frame: stream is closing. Clients MUST stop consuming.
    FsError   error     = 3;
  }
}

message FsEvent {
  // Redis Streams ID. Monotonic within a volume.
  string event_id = 1;
  FsEventType type = 2;
  // The current / post-operation path. For RENAME this is the
  // destination; for every other event type it's the affected path.
  string path = 3;
  // Populated only for RENAME: the source path the inode was renamed
  // from. Clients receiving a RENAME MUST treat `path` as the new name
  // and `old_path` as the previous name to update their caches.
  //
  // Field number 4 was previously named `target_path`, but the
  // direction was ambiguous (name implied dst; value was src). Renamed
  // pre-1.0 while the service has no stable clients.
  string old_path = 4;
  // Populated for CREATE / WRITE / MKDIR / RENAME (target inode); absent
  // for DELETE.
  FileMeta meta = 5;
  int64 ts_ns = 6;
}

enum FsEventType {
  FS_EVENT_TYPE_UNSPECIFIED = 0;
  FS_EVENT_TYPE_CREATE      = 1;
  FS_EVENT_TYPE_WRITE       = 2;
  FS_EVENT_TYPE_DELETE      = 3;
  FS_EVENT_TYPE_RENAME      = 4;
  FS_EVENT_TYPE_MKDIR       = 5;
}

message Heartbeat {
  // High-water-mark event_id at the time of heartbeat. Idle clients
  // advance their resume cursor to this ID.
  string last_event_id = 1;
  int64 ts_ns = 2;
}

