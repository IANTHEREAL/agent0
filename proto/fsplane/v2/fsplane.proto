// =============================================================================

message GetVolumeInfoRequest {
  string volume_id = 1;
}

message GetVolumeInfoResponse {
  oneof result {
    GetVolumeInfoSuccess success = 1;
    FsError              error   = 2;
  }
}

message GetVolumeInfoSuccess {
  // Advisory snapshot of the live mount's effective server-side JuiceFS
  // writeback setting. Lazy/data-plane clients may use this as a handshake,
  // but for the race-free mode that ran a specific write/flush mutation,
  // read that RPC's `server_writeback` response field.
  bool server_writeback = 1;
}

// =============================================================================
// Admin (FsPlaneAdmin service)
// =============================================================================

message InitVolumeRequest {
  string volume_id = 1;
  // JuiceFS meta URL (`tikv://<pd>?keyspace=<volume_id>...`).
  //
  // Whenever this field is non-empty, fs9 verifies the `keyspace=` query
  // param (when present) appears exactly once, is non-empty, and equals
  // `volume_id`. Violations are rejected with reason `keyspace_mismatch:`.
  // This is a consistency check on admin's two inputs (volume_id and the
  // URL's keyspace) — independent of any deployment configuration.
  //
  // Beyond that check, behavior depends on whether the deployment
  // configures fs9 with a canonical meta URL builder:
  //
  //   builder configured (production with lazy-attach):
  //     fs9 is the sole source of truth for the meta URL. It is computed
  //     from `volume_id` alone, and JuiceFS receives that computed URL.
  //     Any other content of this field is IGNORED — operators tuning
  //     mount params (PD endpoints, TLS paths, gc-interval) configure
  //     fs9, not this URL.
  //
  //   builder not configured (test fixtures, deployments without
  //   lazy-attach):
  //     this field is the only source of truth. After the keyspace
  //     check, fs9 passes the URL through to JuiceFS unchanged.
  string meta_url = 2;
  // 0 = server default.
  uint32 cache_size_mb = 3;
  // Opt-in to relaxed performance mode: when true, fs9 mounts JuiceFS
  // with server-side writeback enabled. Default (false) is the strict
  // mode: fs9 mounts JuiceFS with writeback disabled, so a successful
  // write/flush RPC has no hidden server-side writeback gap behind it.
  //
  // Admin-vs-admin mode changes are mount-time-only: a subsequent
  // InitVolume with a different `server_writeback` returns
  // FailedPrecondition (intent_conflict). Operator must CloseVolume and
  // re-Init to switch modes.
  //
  // Admin-over-lazy reconcile is allowed when the live entry was opened
  // lazily and carries no explicit ServerWriteback intent. The request
  // updates stored intent and returns success; the live mount keeps the lazy
  // mode until eviction/remount applies the stored admin intent. The
  // rawstaging cache directory is segregated by mode so strict and relaxed
  // state can never share local on-disk staging.
  bool server_writeback = 4;
}

message InitVolumeResponse {
  oneof result {
    InitVolumeSuccess success = 1;
    FsError           error = 2;
  }
}

message InitVolumeSuccess {
  // True if newly initialized, false if already active (idempotent).
  bool created = 1;
  // Echoes the live entry's effective server-side JuiceFS writeback setting.
  // On fresh mounts and admin-vs-admin idempotent re-Init this equals the
  // request value. On admin-over-lazy reconcile this may remain the
  // lazy-mounted live value until a later CloseVolume or eviction remounts
  // with the stored admin intent. Strict admin-vs-admin mode mismatches are
  // rejected with intent_conflict.
  bool server_writeback = 2;
}

message CloseVolumeRequest {
  string volume_id = 1;
}

message CloseVolumeResponse {
  oneof result {
    CloseVolumeSuccess success = 1;
    FsError            error = 2;
  }
}

message CloseVolumeSuccess {}

message AdvanceNextChunkRequest {
  string volume_id = 1;
  // Amount to add to the JuiceFS nextChunk counter. Use 1<<40 for
  // standard post-clone safety margin. Must be non-negative.
  int64 offset = 2;
}

message AdvanceNextChunkResponse {
  oneof result {
    AdvanceNextChunkSuccess success = 1;
    FsError                 error = 2;
  }
  // Effective server-side writeback mode for a successful mutation result.
  // Read from the mount lease that executed the mutation; ignore on error.
  bool server_writeback = 3;
}

message AdvanceNextChunkSuccess {
  int64 new_value = 1;
  int64 old_value = 2;
}

message DestroyVolumeRequest {
  string volume_id = 1;
  // TiKV meta URL (`tikv://<pd>?keyspace=<volume_id>...`).
  //
  // Same regime-dependent rules as `InitVolumeRequest.meta_url` — see
  // that field for details. In short: keyspace consistency is always
  // checked; in builder-configured deployments fs9 ignores everything
  // else in this field and JuiceFS receives the canonical URL,
  // preventing an admin-supplied URL from `config.UpdateGlobal`-mutating
  // process-wide TiKV state through JuiceFS's driver.
  string meta_url = 2;
  // When true, skip the active-session check. Use when destroying after
  // a stuck-session situation or an unclean shutdown left ghost sessions.
  bool force = 3;
  // When true, skip the JuiceFS meta.Reset() step. Callers that
  // immediately ARCHIVE the keyspace via PD set this — kvengine's
  // compaction filter then handles meta removal, and we avoid issuing
  // a TiKV kv_delete_range RPC (which panics on TiDB Cloud Serverless's
  // cloud-storage-engine fork; only unsafe_destroy_range is wired up
  // there).
  //
  // Response: meta_reset will be false in this mode. The caller MUST
  // archive the keyspace itself.
  //
  // Note: this RPC no longer touches S3 objects regardless of this flag;
  // S3 lifecycle is owned by ReapSliceGC.
  bool skip_meta_reset = 4;
}

message DestroyVolumeResponse {
  oneof result {
    DestroyVolumeSuccess success = 1;
    FsError              error = 2;
  }
}

message DestroyVolumeSuccess {
  // Retained for wire stability. ALWAYS zero: fs9 no longer touches S3
  // objects in this RPC. S3 lifecycle is owned by ReapSliceGC.
  uint64 objects_deleted = 1;
  // Retained for wire stability. ALWAYS zero.
  uint64 objects_failed = 2;
  // True iff meta.Reset() was successfully invoked in this call. False
  // when skip_meta_reset=true (caller will PD-archive the keyspace).
  bool meta_reset = 3;
}

// =============================================================================
// ReapSliceGC — cross-keyspace slice garbage collection
// =============================================================================
//
// Why a separate RPC. After TiKV BR clone (db9-backend #1401), multiple
// JuiceFS keyspaces share one S3 prefix (`format.Name`). The only correct
// predicate for deleting an S3 object is "no keyspace in the clone family
// references it"; this requires a view over the entire family, which
// neither a JuiceFS mount nor a per-volume DestroyVolume has. fs9 #80 and
// its destroy-side variant are both instances of trying to delete S3 from
// a process that only sees one keyspace.
//
// ReapSliceGC takes the family as input. fs9 is stateless: it doesn't
// store the family graph. The caller (db9-backend cron) computes the
// family from its tenant DB on each invocation, sends it in, and fs9
// executes the union-and-delete with the supplied view as the ground
// truth for this run.
//
// Invariants the caller MUST uphold:
//   I1. Before triggering JuiceFS BR for a new clone, the new keyspace
//       MUST appear in `members` with status=PROVISIONING. ReapSliceGC
//       fail-closes the entire family if any PROVISIONING member is
//       present, so the in-flight BR cannot be raced by deletion.
//   I2. A keyspace MUST remain in `members` (as ACTIVE) until its
//       JuiceFS meta keyspace has been physically removed (PD
//       archive_keyspace has completed — i.e., the
//       tenant_purge_phase has advanced to ARCHIVE_JFS_META_KEYSPACE
//       or beyond). Dropping a keyspace from the list while its meta
//       is still readable causes the next reap to delete slices that
//       keyspace still references; KEEPING it in the list after the
//       meta is gone causes the reap to fail-closed on an unformatted
//       ACTIVE member.
//
// db9-backend's existing state machine satisfies both invariants
// directly:
//   - `tenants.state = CLONING` is set in the same SQL transaction that
//     creates the branch job (db.rs:1355), well before the BR worker
//     advances to phase=RESTORING_JFS that triggers the actual BR. Map
//     CLONING (with non-terminal branch_job phase) → PROVISIONING.
//   - The tenant_purge_jobs pipeline (reconciler.rs) keeps the tenant
//     row in the DB through DESTROY_VOLUME → ARCHIVE_SQL_KEYSPACE →
//     ARCHIVE_JFS_META_KEYSPACE → REAP_S3_PREFIX → FINALIZE_TENANT.
//     Exclude a member from `members` once its phase has reached
//     ARCHIVE_JFS_META_KEYSPACE (meta keyspace archived in PD — meta
//     client open would fail). The tenant ROW stays in the DB through
//     REAP_S3_PREFIX so the cron's "any non-PURGED tenant for this
//     format.Name" rule keeps targeting the prefix, but the row no
//     longer contributes to `members` because there's no meta left to
//     scan. See docs/design/slice_reaper.md §"Contract" item 2 for the
//     full SQL filter; this comment and that doc MUST agree.

message ReapSliceGCRequest {
  // Required by the v2 protocol convention (`volume_id = 1` on every
  // request message; see DESIGN.md §A4). The reaper operates on a whole
  // family, not a single volume — set this to any one of the family
  // members' volume_ids (typically the family root / source tenant's).
  // fs9 uses it ONLY to satisfy the auth interceptor's tid→volume_id
  // check; the reap work itself is driven by `format_name` + `members`.
  string volume_id = 1;

  // S3 prefix this reap targets, == JuiceFS format.Name shared across all
  // members of the family.
  string format_name = 2;

  // Bucket URL — same shape as meta.Format.Bucket. fs9 builds the S3
  // client from this plus its IRSA credentials, identically to mount/
  // destroy code paths. Required: fs9 cross-validates against each
  // ACTIVE member's loaded format and fails closed on mismatch
  // (defense against a caller that accidentally mixes keyspaces from
  // different storage tracts into one family).
  string bucket = 3;

  // Members of the clone family for this format_name. db9-backend
  // computes from its tenants table on each cron tick (no fs9-side
  // graph).
  //
  // An empty list is the FINAL-CLEANUP case: the last family member
  // has been physically destroyed (PD archive_keyspace has completed)
  // and no keyspace remains. The reaper falls back to `bucket` +
  // `format_name` + `storage` to anchor an S3 client (members would
  // otherwise be the only source of those fields) and treats EVERY
  // object under the prefix older than the safety window as orphan
  // — which is correct, since no keyspace references anything anymore.
  repeated FamilyMember members = 4;

  // Minimum age in seconds of an S3 object before it may be deleted.
  // Load-bearing for correctness: covers
  //   (a) the doWrite → commit-K window inside JuiceFS, and
  //   (b) any lag between db9-backend updating its tenant state and
  //       this RPC being issued.
  // 0 → server default (24h). Set higher (e.g., 604800 = 7d) when
  // db9-backend's PROVISIONING handoff is still being tightened up.
  int64 safety_window_seconds = 5;

  // If true, compute the orphan set and return stats but do NOT delete
  // any S3 object. Use for pre-flight validation in ops.
  bool dry_run = 6;

  // JuiceFS storage type — value of meta.Format.Storage. In production
  // fs9 deployments this is always "s3" (autoFormat hardcodes it);
  // tests and self-hosted setups may pass "file" / "minio" / etc.
  // Required: needed to synthesize an anchor format for the empty-
  // members final-cleanup path. When `members` is non-empty AND at
  // least one member has a loadable format, fs9 cross-validates
  // `storage` against that member's `format.Storage` and fails closed
  // on mismatch — same defense as for `bucket`.
  string storage = 7;
}

message FamilyMember {
  // PD keyspace name for this member.
  string keyspace = 1;

  // JuiceFS meta URL for opening a read-only scan session.
  // (`tikv://<pd>?keyspace=<keyspace>` plus the standard mTLS params.)
  string meta_url = 2;

  // Lifecycle status. PROVISIONING fails the whole family closed.
  FamilyMemberStatus status = 3;
}

enum FamilyMemberStatus {
  FAMILY_MEMBER_STATUS_UNSPECIFIED = 0;
  // BR clone is in flight or otherwise not yet committed. Reaper aborts
  // the entire family run on encountering any PROVISIONING member.
  FAMILY_MEMBER_STATUS_PROVISIONING = 1;
  // Operational. Refs in this member's meta contribute to the live union.
  FAMILY_MEMBER_STATUS_ACTIVE = 2;
}

message ReapSliceGCResponse {
  oneof result {
    ReapSliceGCSuccess success = 1;
    FsError            error = 2;
  }
}

message ReapSliceGCSuccess {
  // Number of family members whose meta was scanned this run. When
  // `fail_closed_provisioning = true`, this is 0 (no scan was attempted).
  uint32 members_scanned = 1;
  // Count of distinct slice IDs in the live union across all scanned
  // members.
  uint64 live_slice_count = 2;
  // S3 objects listed under the prefix.
  uint64 objects_listed = 3;
  // S3 objects classified as orphan (not in union AND older than the
  // safety window).
  uint64 orphans_found = 4;
  // S3 objects actually deleted. Equals `orphans_found` when
  // `dry_run = false` and all deletes succeeded.
  uint64 objects_deleted = 5;
  // S3 delete failures. The handler tolerates per-object failures and
  // surfaces the count so caller can retry on the next cron tick.
  uint64 delete_failures = 6;
  // True iff the reap was aborted because a PROVISIONING member was
  // present in the request. All counters are zero in that case. NOTE:
  // a response with this flag set is "did not look," NOT "looked and
  // found nothing." Any caller predicate that decides forward progress
  // on `objects_listed == 0` (e.g. db9-backend's REAP_S3_PREFIX phase
  // advancement) MUST also require `fail_closed_provisioning == false`
  // and `delete_failures == 0`. See docs/design/slice_reaper.md
  // §"`REAP_S3_PREFIX` purge phase" for the full predicate.
  bool fail_closed_provisioning = 7;
  // Echoes the request's dry_run.
  bool dry_run = 8;
}
