# pg-tikv Cloud Admin Portal - Production Docker Compose
# Usage: docker compose up -d

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
      # Uncomment for HTTPS
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - PGTIKV_PD_ENDPOINTS=${PD_ENDPOINTS:-localhost:2379}
      - PGTIKV_PG_HOST=${PG_HOST:-host.docker.internal}
      - PGTIKV_PG_PORT=${PG_PORT:-5433}
      - PGTIKV_PG_PUBLIC_ENDPOINTS=${PG_PUBLIC_ENDPOINTS:-127.0.0.1:5433}
      - PGTIKV_API_PORT=8090
      - PGTIKV_API_HOST=0.0.0.0
      - PGTIKV_DATABASE_URL=${DATABASE_URL:-sqlite://data/portal.db?mode=rwc}
      - PGTIKV_API_KEYS=${API_KEYS:-}
      - PGTIKV_CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,https://admin.example.com}
      - RUST_LOG=${RUST_LOG:-info}
    expose:
      - "8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend-builder:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: build
    volumes:
      - frontend-dist:/app/dist

volumes:
  frontend-dist:
