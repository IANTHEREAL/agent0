[package]
name = "pg-tikv"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# TiKV Client (vendored locally to add pessimistic_lock_wait_timeout support
# for SKIP LOCKED / NOWAIT semantics — upstream has `wait_timeout = 0` hardcoded)
tikv-client = { path = "vendor/tikv-client" }

# SQL Parser (standalone, no execution engine)
sqlparser = { version = "0.40", features = ["visitor"] }

# Postgres Protocol
pgwire = "0.28"

# TLS support
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
rustls-pki-types = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1"
memcomparable = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
bytes = "1.5"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
chrono = "0.4"
chrono-tz = "0.10"
regex = "1.10"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
itoa = "1.0"
ryu = "1.0"
rust_decimal = { version = "1.33", features = ["serde", "db-postgres", "maths"] }
base64 = "0.22"
md5 = "0.7"
stacker = "0.1"
dashmap = "6.0"
csv = "1.3"
globset = "0.4"
jsonwebtoken = "9"
cron = "0.15"

# Chinese tokenizer for full-text search
jieba-rs = "0.7"

# ICU for collation support
rust_icu_ucol = "5.0"
rust_icu_ustring = "5.0"
once_cell = "1.19"

# Parquet support (optional, gated by 'parquet' feature)
parquet = { version = "57", optional = true, default-features = false, features = ["arrow", "async", "snap", "zstd", "lz4"] }
arrow = { version = "57", optional = true, default-features = false }
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
arrow-cast = { version = "57", optional = true }

[features]
parquet = ["dep:parquet", "dep:arrow", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-cast"]

[patch.crates-io]
pgwire = { path = "crates/pgwire" }
