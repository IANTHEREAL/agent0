[workspace]
members = [".", "crates/db9-model", "vendor/tikv-client", "vendor/tikv-client/proto-build"]
default-members = [".", "crates/db9-model"]
resolver = "3"

[package]
name = "db9-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
# Workspace crates
db9-model = { path = "crates/db9-model" }

# Memory allocator — jemalloc replaces glibc malloc to prevent arena
# fragmentation that inflates RSS 5-10× in multi-tenant deployments.
# TiKV itself uses jemalloc for the same reason.
tikv-jemallocator = "0.6"

# Async runtime
tokio = { version = "1.36", features = ["full", "test-util"] }
tokio-tungstenite = "0.24"
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"

# TiKV Client (vendored locally to add pessimistic_lock_wait_timeout support
# for SKIP LOCKED / NOWAIT semantics — upstream has `wait_timeout = 0` hardcoded)
tikv-client = { path = "vendor/tikv-client" }

# SQL Parser (standalone, no execution engine)
sqlparser = { version = "0.40", features = ["visitor"] }

# Postgres Protocol
pgwire = "0.28"

# TLS support
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
rustls-pki-types = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
bincode = "1.3"
rmp-serde = "1"
memcomparable = "0.2"
prost = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Prometheus metrics (same crates as db9-backend)
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Utils
bytes = "1.5"
socket2 = { version = "0.6", features = ["all"] }
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
chrono = "0.4"
chrono-tz = "0.10"
regex = "1.10"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
itoa = "1.0"
ryu = "1.0"
rust_decimal = { version = "1.33", features = ["serde", "db-postgres", "maths"] }
bigdecimal = "0.4"
base64 = "0.22"
md5 = "0.7"
stacker = "0.1"
dashmap = "6.0"
parking_lot = "0.12"
quick_cache = "0.6"
csv = "1.3"
globset = "0.4"
cron = "0.15"
jsongrep = "0.7"
serde_json_borrow = "0.9"

# S3 object store (fs9 v2)
aws-config = { version = "=1.8.13", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "=1.110.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }

# Chinese tokenizer for full-text search
jieba-rs = "0.7"

# Snowball stemming for full-text search
rust-stemmers = "1.2"

# ICU for collation support
rust_icu_ucol = "5.0"
rust_icu_ustring = "5.0"
once_cell = "1.19"

# Redis (event streaming for fs9 watch)
redis = { version = "0.27", features = ["tokio-comp", "streams"] }

# HNSW vector search
usearch = "0.21"

# Parquet support (optional, gated by 'parquet' feature)
parquet = { version = "57", optional = true, default-features = false, features = ["arrow", "async", "snap", "zstd", "lz4"] }
arrow = { version = "57", optional = true, default-features = false }
arrow-array = { version = "57", optional = true }
arrow-schema = { version = "57", optional = true }
arrow-cast = { version = "57", optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }

[features]
default = ["parquet"]
parquet = ["dep:parquet", "dep:arrow", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-cast"]

[patch.crates-io]
pgwire = { path = "crates/pgwire" }
sqlparser = { path = "crates/sqlparser" }
jsongrep = { path = "crates/jsongrep" }
