apiVersion: v1
kind: Namespace
metadata:
  name: tipg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-tikv
  namespace: tipg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-tikv
  template:
    metadata:
      labels:
        app: pg-tikv
    spec:
      containers:
      - name: pg-tikv
        image: 093162653901.dkr.ecr.us-west-2.amazonaws.com/pg-tikv:latest
        ports:
        - containerPort: 5433
        env:
        - name: PD_ENDPOINTS
          value: "serverless-cluster-pd.tidb-serverless.svc.cluster.local:2379"
        - name: PG_PORT
          value: "5433"
        - name: PG_LISTEN_ADDR
          value: "0.0.0.0"
        - name: TIKV_CA_PATH
          value: "/tls/ca.crt"
        - name: TIKV_CERT_PATH
          value: "/tls/tls.crt"
        - name: TIKV_KEY_PATH
          value: "/tls/tls.key"
        volumeMounts:
        - name: tikv-tls
          mountPath: /tls
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: tikv-tls
        secret:
          secretName: serverless-cluster-cluster-client-secret
---
apiVersion: v1
kind: Service
metadata:
  name: pg-tikv
  namespace: tipg
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: pg-tikv
  ports:
  - port: 5433
    targetPort: 5433
    protocol: TCP
