apiVersion: v1
kind: Namespace
metadata:
  name: db9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db9-server
  namespace: db9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db9-server
  template:
    metadata:
      labels:
        app: db9-server
    spec:
      containers:
      - name: db9-server
        image: 385595570414.dkr.ecr.us-west-2.amazonaws.com/pg-tikv:latest
        ports:
        - containerPort: 5433
        - containerPort: 5480
        env:
        - name: FS9_WS_LISTEN_ADDR
          value: "0.0.0.0"
        - name: PD_ENDPOINTS
          value: "serverless-cluster-pd.tidb-serverless.svc.cluster.local:2379"
        - name: PG_PORT
          value: "5433"
        - name: PG_LISTEN_ADDR
          value: "0.0.0.0"
        - name: TIKV_CA_PATH
          value: "/tls/ca.crt"
        - name: TIKV_CERT_PATH
          value: "/tls/tls.crt"
        - name: TIKV_KEY_PATH
          value: "/tls/tls.key"
        - name: PG_TLS_CERT
          value: "/pg-tls/tls.crt"
        - name: PG_TLS_KEY
          value: "/pg-tls/tls.key"
        volumeMounts:
        - name: tikv-tls
          mountPath: /tls
          readOnly: true
        - name: pg-tls
          mountPath: /pg-tls
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: tikv-tls
        secret:
          secretName: serverless-cluster-cluster-client-secret
      - name: pg-tls
        secret:
          secretName: db9-server-tls
---
# ClusterIP Service — internal access only (used by db9-backend within cluster)
apiVersion: v1
kind: Service
metadata:
  name: db9-server
  namespace: db9
spec:
  type: ClusterIP
  selector:
    app: db9-server
  ports:
  - name: pgwire
    port: 5433
    targetPort: 5433
    protocol: TCP
  - name: fs9-ws
    port: 5480
    targetPort: 5480
    protocol: TCP
